<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="100%" height="100%">
  <defs>
    <!-- Deep obsidian showroom backdrop -->
    <radialGradient id="bgGlow" cx="52%" cy="38%" r="65%">
      <stop offset="0%" stop-color="#132533" />
      <stop offset="45%" stop-color="#0a1218" />
      <stop offset="100%" stop-color="#05080b" />
    </radialGradient>

    <!-- Floor reflection glow -->
    <radialGradient id="floorBlue" cx="42%" cy="62%" r="45%">
      <stop offset="0%" stop-color="#026dfe" stop-opacity="0.28" />
      <stop offset="100%" stop-color="#026dfe" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="floorAmber" cx="65%" cy="55%" r="40%">
      <stop offset="0%" stop-color="#d16b54" stop-opacity="0.24" />
      <stop offset="100%" stop-color="#d16b54" stop-opacity="0" />
    </radialGradient>

    <!-- Overhead Superloop Halo Ring gradient -->
    <linearGradient id="haloGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.4" />
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.98" />
      <stop offset="100%" stop-color="#d2e2ea" stop-opacity="0.45" />
    </linearGradient>

    <!-- Metallic Sculpted Body Gradients (High-Angle 3/4 Perspective) -->
    <linearGradient id="bodyMain" x1="15%" y1="10%" x2="85%" y2="90%">
      <stop offset="0%" stop-color="#334352" />
      <stop offset="28%" stop-color="#1b252e" />
      <stop offset="60%" stop-color="#0d1318" />
      <stop offset="100%" stop-color="#06090c" />
    </linearGradient>

    <linearGradient id="hoodHighlight" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#5d7890" stop-opacity="0.85" />
      <stop offset="40%" stop-color="#22303c" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#0b1116" stop-opacity="0.98" />
    </linearGradient>

    <linearGradient id="roofGlass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3242" />
      <stop offset="35%" stop-color="#091017" />
      <stop offset="100%" stop-color="#04070a" />
    </linearGradient>

    <linearGradient id="fenderCrease" x1="0%" y1="0%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#026dfe" stop-opacity="0.7" />
      <stop offset="55%" stop-color="#9cc6e8" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#d16b54" stop-opacity="0.45" />
    </linearGradient>

    <linearGradient id="bronzeWheel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f0c878" />
      <stop offset="50%" stop-color="#b87e42" />
      <stop offset="100%" stop-color="#4e3218" />
    </linearGradient>

    <filter id="softBlur" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="16" />
    </filter>
    <filter id="ledGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Studio Background -->
  <rect width="1200" height="750" fill="url(#bgGlow)" />

  <!-- Architectural Perspective Floor Grid (High-Angle View looking down at 38 deg) -->
  <g stroke="#ffffff" stroke-opacity="0.045" stroke-width="1">
    <line x1="0" y1="310" x2="1200" y2="310" />
    <line x1="0" y1="370" x2="1200" y2="370" />
    <line x1="0" y1="440" x2="1200" y2="440" />
    <line x1="0" y1="525" x2="1200" y2="525" />
    <line x1="0" y1="625" x2="1200" y2="625" />
    <line x1="600" y1="250" x2="-200" y2="750" />
    <line x1="600" y1="250" x2="150" y2="750" />
    <line x1="600" y1="250" x2="450" y2="750" />
    <line x1="600" y1="250" x2="750" y2="750" />
    <line x1="600" y1="250" x2="1050" y2="750" />
    <line x1="600" y1="250" x2="1400" y2="750" />
  </g>

  <!-- Ambient Floor Reflections -->
  <ellipse cx="480" cy="490" rx="450" ry="180" fill="url(#floorBlue)" />
  <ellipse cx="720" cy="450" rx="380" ry="150" fill="url(#floorAmber)" />

  <!-- Overhead Superloop Studio Halo Ring Light (Seen from high angle) -->
  <g transform="translate(610, 115)">
    <ellipse cx="0" cy="0" rx="340" ry="62" fill="none" stroke="#026dfe" stroke-width="14" stroke-opacity="0.18" filter="url(#softBlur)" />
    <ellipse cx="0" cy="0" rx="335" ry="58" fill="none" stroke="url(#haloGrad)" stroke-width="6" />
    <line x1="-240" y1="-115" x2="-240" y2="-38" stroke="#ffffff" stroke-opacity="0.2" stroke-width="1.5" />
    <line x1="240" y1="-115" x2="240" y2="-38" stroke="#ffffff" stroke-opacity="0.2" stroke-width="1.5" />
    <line x1="0" y1="-115" x2="0" y2="-58" stroke="#ffffff" stroke-opacity="0.25" stroke-width="1.5" />
  </g>

  <!-- Deep Soft Floor Contact Shadow under Supercar (High-angle 3/4 orientation) -->
  <g transform="translate(595, 455) rotate(-14)">
    <ellipse cx="0" cy="18" rx="415" ry="135" fill="#000000" fill-opacity="0.82" filter="url(#softBlur)" />
    <ellipse cx="-10" cy="12" rx="380" ry="110" fill="#000000" fill-opacity="0.92" />
  </g>

  <!-- ======================================================================= -->
  <!-- HIGH-ANGLE 3/4 BESPOKE SUPERCAR BODY (Looking down onto Hood, Roof, Aero) -->
  <!-- Front-left nose at (215, 470), Rear-right tail at (975, 330)            -->
  <!-- ======================================================================= -->
  <g id="high-angle-supercar">
    <!-- Front Splitter & Carbon Diffuser Lip -->
    <path
      d="M 195 458 Q 225 535 355 568 L 405 552 Q 275 515 215 442 Z"
      fill="#12161b"
      stroke="#d16b54"
      stroke-width="2"
      stroke-opacity="0.85"
    />

    <!-- Main Sculpted Body Shell (High-Angle 3/4 Silhouette) -->
    <path
      d="M 205 445
         C 210 385, 290 342, 405 318
         C 485 260, 595 222, 735 225
         C 855 228, 955 262, 995 315
         C 1015 348, 998 408, 935 448
         C 855 485, 745 508, 615 535
         C 495 560, 405 572, 345 560
         C 245 538, 202 492, 205 445 Z"
      fill="url(#bodyMain)"
      stroke="#3b4f61"
      stroke-width="1.5"
    />

    <!-- Sculpted Front Hood / Frunk Panel (Seen clearly from high angle) -->
    <path
      d="M 225 438
         C 255 390, 340 355, 435 342
         L 510 422
         C 415 478, 325 512, 245 488
         C 222 475, 218 455, 225 438 Z"
      fill="url(#hoodHighlight)"
      stroke="#6d8da8"
      stroke-opacity="0.45"
      stroke-width="1.2"
    />

    <!-- Hood Dual Carbon Aero Vents -->
    <path d="M 295 415 L 365 388 L 378 402 L 308 428 Z" fill="#070a0d" stroke="#d16b54" stroke-width="1" stroke-opacity="0.6" />
    <path d="M 335 452 L 408 424 L 418 438 L 346 466 Z" fill="#070a0d" stroke="#d16b54" stroke-width="1" stroke-opacity="0.6" />

    <!-- Panoramic Teardrop Cockpit Canopy & Windshield (High-Angle Top View) -->
    <path
      d="M 435 338
         C 510 272, 625 245, 748 258
         C 825 268, 882 302, 865 348
         C 842 395, 735 438, 608 448
         C 545 452, 482 410, 435 338 Z"
      fill="url(#roofGlass)"
      stroke="#7ca2c0"
      stroke-opacity="0.55"
      stroke-width="1.8"
    />

    <!-- Windshield & Roof Studio Halo Reflection Strip -->
    <path
      d="M 468 338 C 542 286, 650 266, 758 278 C 772 288, 760 302, 735 304 C 635 295, 545 314, 485 358 Z"
      fill="#ffffff"
      fill-opacity="0.16"
    />

    <!-- Rear Engine Decklid Louvers (High-Angle View of Mid-Engine Bay) -->
    <g stroke="#2a3946" stroke-width="2.5" stroke-linecap="round">
      <line x1="775" y1="282" x2="845" y2="325" />
      <line x1="798" y1="276" x2="868" y2="318" />
      <line x1="822" y1="272" x2="890" y2="312" />
      <line x1="845" y1="270" x2="910" y2="306" />
    </g>

    <!-- Wide Rear Haunch & Side Air Intake Scoop -->
    <path
      d="M 605 452
         C 695 435, 795 395, 885 362
         C 865 415, 775 462, 645 485 Z"
      fill="#0d141b"
      stroke="url(#fenderCrease)"
      stroke-width="2.2"
    />
    <!-- Side Carbon Blade Intake -->
    <path
      d="M 628 455 L 725 418 L 705 462 L 618 475 Z"
      fill="#050709"
      stroke="#026dfe"
      stroke-width="1.2"
      stroke-opacity="0.7"
    />

    <!-- Dramatic Shoulder Sweeping Character Line (Glowing Studio Highlight) -->
    <path
      d="M 248 492 C 365 518, 495 490, 625 452 C 755 414, 875 375, 968 335"
      fill="none"
      stroke="url(#fenderCrease)"
      stroke-width="3.5"
      filter="url(#ledGlow)"
    />

    <!-- Carbon Swan-Neck GT Rear Wing (High-Angle Perspective) -->
    <path
      d="M 885 215
         C 935 225, 1015 278, 1038 335
         L 1005 348
         C 978 292, 905 242, 855 228 Z"
      fill="#111820"
      stroke="#d16b54"
      stroke-width="2"
    />
    <!-- Wing Struts -->
    <line x1="895" y1="275" x2="928" y2="255" stroke="#8a9ba8" stroke-width="4" stroke-linecap="round" />
    <line x1="935" y1="305" x2="972" y2="286" stroke="#8a9ba8" stroke-width="4" stroke-linecap="round" />

    <!-- Quad Matrix LED Headlights (Front Left & Front Right) -->
    <g filter="url(#ledGlow)">
      <!-- Near-side Headlight Cluster -->
      <path d="M 262 502 L 328 518 L 342 504 L 275 488 Z" fill="#026dfe" fill-opacity="0.4" />
      <line x1="268" y1="498" x2="322" y2="510" stroke="#ffffff" stroke-width="4" stroke-linecap="round" />
      <line x1="278" y1="490" x2="332" y2="502" stroke="#70b5ff" stroke-width="2.5" stroke-linecap="round" />

      <!-- Far-side Headlight Edge -->
      <line x1="212" y1="418" x2="245" y2="388" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" />
      <line x1="218" y1="424" x2="252" y2="395" stroke="#026dfe" stroke-width="2" stroke-linecap="round" />

      <!-- Rear LED Lightbar Edge Glimmer -->
      <path d="M 965 335 C 988 362, 975 398, 938 428" fill="none" stroke="#ff2a2a" stroke-width="4" stroke-linecap="round" />
    </g>

    <!-- Front Wheel & Forged Bronze Aero Turbine Rim -->
    <g transform="translate(458, 522) rotate(-12)">
      <ellipse cx="0" cy="0" rx="58" ry="44" fill="#080a0c" stroke="#1e262e" stroke-width="6" />
      <ellipse cx="0" cy="0" rx="44" ry="33" fill="#0d1116" stroke="url(#bronzeWheel)" stroke-width="3.5" />
      <!-- Ceramic Red Brake Caliper -->
      <path d="M -28 -12 A 30 22 0 0 1 -10 -26 L -4 -14 A 18 14 0 0 0 -16 -6 Z" fill="#d16b54" />
      <!-- Forged Y-Spokes -->
      <g stroke="url(#bronzeWheel)" stroke-width="3" stroke-linecap="round">
        <line x1="-38" y1="0" x2="38" y2="0" />
        <line x1="0" y1="-29" x2="0" y2="29" />
        <line x1="-28" y1="-20" x2="28" y2="20" />
        <line x1="-28" y1="20" x2="28" y2="-20" />
      </g>
      <ellipse cx="0" cy="0" rx="10" ry="8" fill="#111" stroke="#d16b54" stroke-width="2" />
    </g>

    <!-- Rear Wheel & Deep Concave Forged Bronze Rim -->
    <g transform="translate(838, 422) rotate(-14)">
      <ellipse cx="0" cy="0" rx="64" ry="48" fill="#080a0c" stroke="#1e262e" stroke-width="7" />
      <ellipse cx="0" cy="0" rx="49" ry="37" fill="#0d1116" stroke="url(#bronzeWheel)" stroke-width="4" />
      <!-- Ceramic Red Brake Caliper -->
      <path d="M -32 -14 A 34 25 0 0 1 -12 -29 L -5 -16 A 20 15 0 0 0 -18 -7 Z" fill="#d16b54" />
      <!-- Forged Y-Spokes -->
      <g stroke="url(#bronzeWheel)" stroke-width="3.2" stroke-linecap="round">
        <line x1="-43" y1="0" x2="43" y2="0" />
        <line x1="0" y1="-33" x2="0" y2="33" />
        <line x1="-31" y1="-23" x2="31" y2="23" />
        <line x1="-31" y1="23" x2="31" y2="-23" />
      </g>
      <ellipse cx="0" cy="0" rx="11" ry="9" fill="#111" stroke="#d16b54" stroke-width="2" />
    </g>
  </g>
</svg>
