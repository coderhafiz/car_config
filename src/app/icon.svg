<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Dark luxury canvas background -->
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0b1720" />
      <stop offset="70%" stop-color="#06090b" />
      <stop offset="100%" stop-color="#030507" />
    </radialGradient>

    <!-- Glowing Blue Gradient for Outer Arc -->
    <linearGradient id="blueArcGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="70%" stop-color="#026dfe" />
      <stop offset="100%" stop-color="#004bc2" />
    </linearGradient>

    <!-- Terracotta Orange Gradient for Inner Arc -->
    <linearGradient id="orangeArcGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff8e75" />
      <stop offset="70%" stop-color="#d16b54" />
      <stop offset="100%" stop-color="#9c3f2b" />
    </linearGradient>

    <!-- Subtle glow filters for retina icons -->
    <filter id="coreGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Circular Base Disc -->
  <circle cx="256" cy="256" r="248" fill="url(#bgGlow)" />

  <!-- Outer Ring Base (Faint Track: rgba(2, 109, 254, 0.22)) -->
  <circle
    cx="256"
    cy="256"
    r="184"
    fill="none"
    stroke="#026dfe"
    stroke-width="16"
    stroke-opacity="0.22"
  />

  <!-- Outer Ring Active Arc (Blue Spinner Arc: 120 deg stroke) -->
  <circle
    cx="256"
    cy="256"
    r="184"
    fill="none"
    stroke="url(#blueArcGrad)"
    stroke-width="18"
    stroke-linecap="round"
    stroke-dasharray="385 770"
    stroke-dashoffset="190"
  />

  <!-- Inner Ring Base (Faint Track: rgba(209, 107, 84, 0.22)) -->
  <circle
    cx="256"
    cy="256"
    r="144"
    fill="none"
    stroke="#d16b54"
    stroke-width="14"
    stroke-opacity="0.22"
  />

  <!-- Inner Ring Active Arc (Orange Spinner Arc: 110 deg stroke) -->
  <circle
    cx="256"
    cy="256"
    r="144"
    fill="none"
    stroke="url(#orangeArcGrad)"
    stroke-width="16"
    stroke-linecap="round"
    stroke-dasharray="276 630"
    stroke-dashoffset="-70"
  />

  <!-- Center: EXACT Drason Font 'C' from the Loader Spinner -->
  <path
    d="M 282.71 239.44 L 332.68 239.44 L 343.50 206.42 L 178.43 206.42 L 186.01 229.18 L 168.50 282.60 L 175.97 305.58 L 311.04 305.58 L 316.40 288.96 L 216.35 288.96 L 238.10 223.04 L 288.07 223.04 Z"
    fill="#026dfe"
    filter="url(#coreGlow)"
  />
</svg>
